name: gluho-nemye-django

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?добавьте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только для локальных тестов и отладки; в проде порт наружу не нужен.
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U app -d app]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - 127.0.0.1:6380:6379

  web:
    build: .
    container_name: gluho-nemye-django-web
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - media:/app/media
    expose:
      - "8000"

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
    depends_on:
      - web

volumes:
  pgdata:
  media:
  caddy_data:
