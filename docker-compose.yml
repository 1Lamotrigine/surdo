name: gluho-nemye-django

# Продакшен-конфигурация (G4). Все настройки берутся из `.env`.
# Локальная разработка использует те же сервисы; порты db/redis привязаны к
# 127.0.0.1. Сайт доступен и через Caddy (:80/:443), и напрямую на :8000
# (uvicorn проброшен на хост для отладки и запуска скрипта нагрузки).
#
# WebSocket-ы Caddy проксирует сам, отдельной настройки не нужно.
# `docker compose up` поднимает весь проект: db, redis, web и caddy.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?добавьте DB_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Только локально: для `make test` и отладки с хоста. В проде порт не нужен.
      - 127.0.0.1:55432:5432
    healthcheck:
      test: [CMD-SHELL, pg_isready -U app -d app]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    ports:
      - 127.0.0.1:6380:6379
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 10
    logging: *default-logging

  web:
    build: .
    image: gluho-nemye-django-web
    container_name: gluho-nemye-django-web
    restart: unless-stopped
    # Один процесс: очереди фраз и presence живут в памяти процесса (ТЗ 5.7).
    command: uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --workers 1
    env_file: .env
    environment:
      # Модель Whisper грузится (при пустом кэше — скачивается) на старте в
      # фоне: первая фраза не платит за это и не упирается в ASR_TIMEOUT.
      ASR_WARMUP: "1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media:/app/media
      # Кэш моделей Whisper/VAD: переживает пересборку образа, поэтому веса
      # не скачиваются заново при каждом `up --build`.
      - hfcache:/home/app/.cache
    # 8000 проброшен на хост, чтобы Django был доступен и напрямую, и через
    # Caddy (:80). `expose` оставлен для проксирования внутри сети Docker.
    ports:
      - "8000:8000"
    expose:
      - "8000"
    healthcheck:
      # `GET /health/` проверяет базу; python есть в образе, curl добавлять не нужно.
      test:
        [
          CMD,
          python,
          -c,
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/', timeout=5).status == 200 else 1)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s
    logging: *default-logging

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"  # HTTP/3
    environment:
      # Домен для HTTPS (например lecture.example.org) или `:80` локально.
      # ACME_EMAIL нужен Caddy для регистрации сертификата; пустым его оставлять
      # нельзя (директива email требует аргумент), поэтому есть запасное значение.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.org}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - media:/srv/media:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *default-logging

volumes:
  pgdata:
  media:
  hfcache:
  caddy_data:
  caddy_config:
