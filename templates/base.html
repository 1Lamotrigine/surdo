{% load static %}<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}ИИ-аватар сурдопереводчик{% endblock %}</title>
    <meta name="description" content="Прототип помощника-сурдопереводчика для лекций: аватар, субтитры и чат в браузере.">
    <link rel="stylesheet" href="{% static 'css/base.css' %}">
  </head>
  <body>
    <a class="skip-link" href="#main">Перейти к содержимому</a>
    <header class="site-header">
      <div class="wrap header-inner">
        <a class="brand" href="/">Жест<span>·</span>Прототип</a>
        <span class="badge">MVP · русский / РЖЯ</span>
      </div>
    </header>

    <main id="main" class="wrap">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <div class="wrap">
        <p>Прототип помощника, а не замена сурдопереводчику. Субтитры всегда дублируют жесты.</p>
      </div>
    </footer>
  </body>
</html>
